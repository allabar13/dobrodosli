<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EAF6FA">
<title>Добродошли! — сербский для жизни на Балканах</title>
<meta name="description" content="Прокачивай сербский для жизни на Балканах: короткие уроки, статистика, собственный словарь и упражнения на разбор ошибок. iPhone или браузер, бесплатно.">
<link rel="canonical" href="https://dobrodosli-app.org/">
<!-- превью при шаринге ссылки в мессенджерах -->
<meta property="og:type" content="website">
<meta property="og:title" content="Добродошли! — сербский для жизни на Балканах">
<meta property="og:description" content="Доведи базовые фразы до автоматизма: прикольная статистика, несгорающие стрики, словарь и галеб Жарко.">
<meta property="og:url" content="https://dobrodosli-app.org/">
<meta property="og:image" content="https://dobrodosli-app.org/app/icons/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="app/css/fonts.css?v=3">
<link rel="stylesheet" href="app/css/styles.css?v=3">
<link rel="apple-touch-icon" href="app/icons/icon-180.png">
<link rel="icon" href="app/icons/icon-192.png" type="image/png">
<script>
// тема — как в системе (токены в styles.css живут на html[data-theme])
const dark = matchMedia('(prefers-color-scheme: dark)');
const applyTheme = () => {
  document.documentElement.dataset.theme = dark.matches ? 'dark' : 'light';
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = dark.matches ? '#0F1B21' : '#EAF6FA';
};
applyTheme(); dark.addEventListener('change', applyTheme);
</script>
<style>
  /* мини-лендинг «открытка»: всё по центру, весь вид — из токенов styles.css */
  body{ display:flex; min-height:100dvh; align-items:center; justify-content:center; padding:16px; }
  .go{ width:100%; max-width:430px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .go .mascot{ width:96px; height:auto; }
  .go h1{ font-size:34px; margin:2px 0 0; letter-spacing:-.5px; }
  .tagline{ margin:0; font-size:16.5px; font-weight:700; color:var(--ink); }
  .byline{ margin:0; max-width:360px; }
  .chips{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:6px 0 2px; }
  .chip{ background:var(--card); border:1.5px solid var(--line); border-radius:999px;
    padding:8px 13px; font-size:13.5px; font-weight:800; box-shadow:var(--shadow); }
  .go-btns{ display:flex; flex-direction:column; gap:8px; margin-top:6px; width:100%; }
  .go-btns .btn{ width:100%; text-decoration:none; display:block; box-sizing:border-box; }
  .btn.soon{ opacity:.6; cursor:default; pointer-events:none; }
  .go-note{ margin:0; }
  .lang-sw{ position:fixed; top:calc(14px + env(safe-area-inset-top)); right:16px; z-index:5;
    background:var(--card); color:var(--muted); border:1.5px solid var(--line);
    border-radius:999px; padding:7px 14px; font-family:inherit; font-weight:800; font-size:13px;
    letter-spacing:.4px; cursor:pointer; }
  .lang-sw:hover{ color:var(--ink); }
  @media (max-height:700px){
    .go .mascot{ width:68px; }
    .go h1{ font-size:27px; }
    .go{ gap:9px; }
  }
</style>
</head>
<body>

<button class="lang-sw" id="go-lang" type="button" aria-label="Switch language">EN</button>

<div class="go">
  <div id="go-mascot"></div>
  <h1>Добродошли!</h1>
  <p class="tagline" id="go-tagline"></p>
  <p class="byline muted small" id="go-byline"></p>
  <div class="chips" id="go-chips"></div>
  <div class="go-btns" id="go-btns"></div>
  <p class="go-note muted small" id="go-note"></p>
</div>

<script>
// Ссылка на App Store: после публикации вписать https://apps.apple.com/app/idXXXXXXXXXX
const APP_STORE_URL = '';
const WEB_URL = './app/';

// галеб Жарко (копия mascotSvg('happy') из app/js/data.js — чтобы не грузить весь курс)
document.getElementById('go-mascot').innerHTML = `<svg viewBox="0 0 80 84" class="mascot" aria-hidden="true">
  <path d="M33 11 Q36 5 39 10" stroke="#C9D9E1" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M41 10 Q44 5 47 11" stroke="#C9D9E1" stroke-width="2" fill="none" stroke-linecap="round"/>
  <line x1="34" y1="64" x2="33" y2="76" stroke="#F2A93B" stroke-width="3" stroke-linecap="round"/>
  <line x1="46" y1="64" x2="47" y2="76" stroke="#F2A93B" stroke-width="3" stroke-linecap="round"/>
  <line x1="29" y1="77" x2="37" y2="77" stroke="#F2A93B" stroke-width="3" stroke-linecap="round"/>
  <line x1="43" y1="77" x2="51" y2="77" stroke="#F2A93B" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="40" cy="48" rx="23" ry="20" fill="#FCFDFD"/>
  <path d="M18 42 Q15 58 32 65 Q24 52 26 40 Z" fill="#C9D9E1"/>
  <path d="M62 42 Q65 58 48 65 Q56 52 54 40 Z" fill="#C9D9E1"/>
  <path d="M33 66 L40 73 L47 66 Z" fill="#5E7480"/>
  <circle cx="40" cy="25" r="16" fill="#FCFDFD"/>
  <circle cx="31" cy="25" r="3.2" fill="#1B2B33"/><circle cx="49" cy="25" r="3.2" fill="#1B2B33"/>
  <path d="M35 32 L45 32 L40 39 Z" fill="#F2A93B"/><circle cx="41.5" cy="34.5" r="1.1" fill="#E2554F"/>
  <path d="M26 41 Q40 51 54 41 L54 49 Q40 59 26 49 Z" fill="var(--primary, #1899C2)"/>
</svg>`;

// тексты лендинга: ru по умолчанию, кнопка переключает на en и обратно
const L = {
  ru: {
    tagline: 'Прокачивай сербский для жизни на Балканах',
    byline: 'Трушная лексика от черногорского галеба Жарко и одного разработчика-эмигранта. Сделано с любовью и буреком.',
    chips: ['уроки из реальной жизни', 'кафана, пияца, МУП', 'живая озвучка', 'кириллица и латиница', 'ачивки и стрики', 'свой словарь', 'разбор ошибок'],
    web: '🌐 Заниматься в браузере',
    store: ' Скачать в App Store',
    soon: ' Скоро в App Store 🕊',
    note: 'Чтобы прогресс синхронизировался между устройствами,\nвойди через Google- или Apple-аккаунт',
    btn: 'EN', lang: 'ru',
    title: 'Добродошли! — сербский для жизни на Балканах',
  },
  en: {
    tagline: 'Level up your Serbian for life in the Balkans',
    byline: 'True-to-life vocab from Žarko the Montenegrin seagull and one expat developer. Made with love and burek.',
    chips: ['lessons from real life', 'kafana, pijaca, MUP', 'every word voiced', 'Cyrillic and Latin', 'achievements & streaks', 'your own vocabulary', 'mistake review'],
    web: '🌐 Practice in the browser',
    store: ' Download on the App Store',
    soon: ' Coming soon to the App Store 🕊',
    note: 'Sign in with your Google or Apple account\nto sync progress across devices',
    btn: 'RU', lang: 'en',
    title: 'Dobrodošli! — Serbian for life in the Balkans',
  },
};

// кнопки: на iPhone/iPad первым — App Store (когда ссылка появится), иначе веб
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

let lang = 'ru';
try { if (localStorage.getItem('go_lang') === 'en') lang = 'en'; } catch (e) {}

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

function render() {
  const s = L[lang];
  document.documentElement.lang = s.lang;
  document.title = s.title;
  document.getElementById('go-tagline').textContent = s.tagline;
  document.getElementById('go-byline').textContent = s.byline;
  document.getElementById('go-chips').innerHTML = s.chips.map(c => `<span class="chip">${esc(c)}</span>`).join('');
  document.getElementById('go-note').innerHTML = esc(s.note).replace('\n', '<br>');
  document.getElementById('go-lang').textContent = s.btn;
  const appBtn = APP_STORE_URL
    ? `<a class="btn ${isIOS ? 'primary big' : 'ghost'}" href="${APP_STORE_URL}">${s.store}</a>`
    : `<span class="btn ghost soon">${s.soon}</span>`;
  const webBtn = `<a class="btn ${APP_STORE_URL && isIOS ? 'ghost' : 'primary big'}" href="${WEB_URL}">${s.web}</a>`;
  document.getElementById('go-btns').innerHTML = (APP_STORE_URL && isIOS) ? appBtn + webBtn : webBtn + appBtn;
}

document.getElementById('go-lang').addEventListener('click', () => {
  lang = lang === 'ru' ? 'en' : 'ru';
  try { localStorage.setItem('go_lang', lang); } catch (e) {}
  render();
});
render();
</script>
</body>
</html>
